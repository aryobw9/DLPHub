[workspace]
members = [".", "dlp-core"]

[package]
name = "dlpbooster"
version = "0.1.1"
description = "DLPHub - Deadlock FPS/graphics GUI"
authors = ["aryobw9"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# cdylib removed: windows-gnu debug linker caps DLL export ordinals at 65535
# and Tauri debug builds export ~91k symbols ("export ordinal too large").
# staticlib+rlib covers desktop builds; re-add cdylib only for mobile dev.
name = "dlpbooster_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
winreg = "0.55"
dlp-core = { path = "dlp-core" }
open = "5"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
