<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hyperline</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*"
    />
  </head>
  <body>
    <script>
      'use strict'
      const candidatePorts = [4321, 4320, 4318]
      const calls = new Map()
      let socket = null
      let sequence = 0
      let acknowledgment = null
      let presentations = Promise.resolve()
      let lastCommand = 0

      function present(line, signal) {
        const next = presentations.then(async () => {
          const source = encodeURIComponent(line)
          const id = ++sequence
          for (let offset = 0; offset < source.length; offset += 3072) {
            if (signal?.aborted) return
            const chunk = source.slice(offset, offset + 3072)
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                acknowledgment = null
                reject(new Error('Resident title acknowledgment timed out'))
              }, 6000)
              acknowledgment = {
                id,
                offset: offset + chunk.length,
                resolve,
                timer,
              }
              document.title =
                'modlock:snapshot:' +
                JSON.stringify({ id, offset, total: source.length, chunk })
            })
          }
        })
        presentations = next
        return next
      }

      async function lines(response, receive) {
        if (!response.ok || !response.body)
          throw new Error('SDK HTTP ' + response.status)
        const reader = response.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''
        try {
          for (;;) {
            const { value, done } = await reader.read()
            if (done) return
            buffer += decoder.decode(value, { stream: true })
            for (
              let end = buffer.indexOf('\n');
              end >= 0;
              end = buffer.indexOf('\n')
            ) {
              const line = buffer.slice(0, end)
              buffer = buffer.slice(end + 1)
              await receive(line)
            }
          }
        } finally {
          await reader.cancel().catch(() => {})
        }
      }

      function connectSocket(port) {
        return new Promise((resolve) => {
          let opening
          try {
            opening = new WebSocket('ws://127.0.0.1:' + port + '/channel/rpc')
          } catch {
            resolve(null)
            return
          }
          opening.onopen = () => resolve(opening)
          opening.onmessage = (event) => receive(JSON.parse(event.data))
          opening.onclose = () => {
            resolve(null)
            if (socket === opening) detached()
          }
        })
      }

      async function connect() {
        for (const port of candidatePorts) {
          const s = await connectSocket(port)
          if (s) return s
        }
        return null
      }

      function send(message) {
        const controller = new AbortController()
        calls.set(message.id, controller)
        controller.signal.addEventListener('abort', () => {
          calls.delete(message.id)
          socket?.send(JSON.stringify({ id: message.id, cancel: true }))
        })
        socket?.send(JSON.stringify({ id: message.id, call: message.call }))
      }

      function receive({ id, data }) {
        const controller = calls.get(id)
        if (!controller) return
        const reply = JSON.parse(data)
        if (reply.complete || reply.error) calls.delete(id)
        void present(
          'hyperline-rpc:' + JSON.stringify({ id, data }),
          controller.signal,
        ).catch(detached)
      }

      async function call(message) {
        const controller = new AbortController()
        calls.set(message.id, controller)
        try {
          let response = null
          for (const port of candidatePorts) {
            try {
              response = await fetch('http://127.0.0.1:' + port + '/channel/rpc', {
                method: 'POST',
                body: message.call,
                signal: controller.signal,
              })
              if (response.ok) break
            } catch {}
          }
          if (!response || !response.ok) throw new Error('SDK unavailable')
          let complete = false
          await lines(response, async (data) => {
            const reply = JSON.parse(data)
            complete = complete || reply.complete || !!reply.error
            if (!controller.signal.aborted)
              await present(
                'hyperline-rpc:' + JSON.stringify({ id: message.id, data }),
                controller.signal,
              )
          })
          if (!complete && !controller.signal.aborted)
            throw new Error('SDK stream ended without completion')
        } catch (error) {
          if (!controller.signal.aborted) {
            await present(
              'hyperline-rpc:' +
                JSON.stringify({
                  id: message.id,
                  data: JSON.stringify({
                    complete: true,
                    error: String(error),
                  }),
                }),
            )
          }
        } finally {
          calls.delete(message.id)
        }
      }

      function acknowledge() {
        if (!acknowledgment) return
        clearTimeout(acknowledgment.timer)
        acknowledgment.resolve()
        acknowledgment = null
      }

      addEventListener('hashchange', () => {
        const hash = location.hash.slice(1)
        if (hash === '0' || hash === '1') {
          acknowledge()
          return
        }
        let packet
        try {
          packet = JSON.parse(decodeURIComponent(hash))
        } catch {
          return
        }
        if (
          acknowledgment &&
          packet.frameAck === acknowledgment.id &&
          packet.offset === acknowledgment.offset
        )
          acknowledge()
        const message = packet.command
        if (!message || message.nonce <= lastCommand) return
        lastCommand = message.nonce
        if (message.cancel) calls.get(message.id)?.abort()
        void present('hyperline-rpc-ack:' + message.nonce).catch(detached)
        if (message.call && socket) send(message)
        else if (message.call) void call(message).catch(detached)
      })

      function detached() {
        for (const controller of calls.values()) controller.abort()
        document.title = 'hyperline:0 detached'
      }

      async function attach() {
        socket = await connect()
        for (const port of candidatePorts) {
          try {
            const response = await fetch('http://127.0.0.1:' + port + '/channel/stream')
            if (response?.ok && response.body) return response
          } catch {}
        }
        const opened = socket
        socket = null
        opened?.close()
        return null
      }

      ;(async function run() {
        document.title = 'hyperline:0 waiting'
        for (let wait = 2000; ; wait = Math.min(wait * 2, 30000)) {
          const response = await attach()
          if (response) {
            await present('hyperline:0 attached')
            await lines(response, present)
            return
          }
          await new Promise((resolve) => setTimeout(resolve, wait))
        }
      })()
        .catch(() => {})
        .finally(detached)
    </script>
  </body>
</html>
