<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>modlock:bridge-ready</title>
    <!--
  Panorama developer bridge. The native bridge panel loads this page and reads
  document.title. Each streamed line is one complete protojson OverlayEnvelope
  produced by the host. Acknowledged title parts preserve complete frames
  through the engine's title limit without interpreting their contents.
-->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*"
    />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      'use strict'
      // Support loopback on 4320 or 4318
      const candidatePorts = [4320, 4318]
      let activePort = 4320
      let frameId = 0
      let acknowledgment = null

      addEventListener('hashchange', () => {
        if (!acknowledgment) return
        clearTimeout(acknowledgment.timer)
        acknowledgment.resolve()
        acknowledgment = null
      })

      async function present(line) {
        const source = encodeURIComponent(line)
        const id = ++frameId
        for (let offset = 0; offset < source.length; offset += 3072) {
          const chunk = source.slice(offset, offset + 3072)
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              acknowledgment = null
              reject(new Error('Snapshot acknowledgment timed out'))
            }, 6000)
            acknowledgment = { resolve, timer }
            document.title =
              'modlock:snapshot:' +
              JSON.stringify({ id, offset, total: source.length, chunk })
          })
        }
      }

      ;(async function run() {
        for (;;) {
          for (const port of candidatePorts) {
            try {
              const base = location.protocol === 'https:' ? 'http://127.0.0.1:' + port : ''
              const response = await fetch(base + '/panorama/stream')
              if (!response.ok || !response.body) {
                continue
              }
              activePort = port
              const reader = response.body.getReader()
              try {
                const decoder = new TextDecoder()
                let buffer = ''
                for (;;) {
                  const { value, done } = await reader.read()
                  if (done) break
                  buffer += decoder.decode(value, { stream: true })
                  let newline = buffer.indexOf('\n')
                  while (newline >= 0) {
                    const line = buffer.slice(0, newline).trim()
                    buffer = buffer.slice(newline + 1)
                    if (line.length > 0) await present(line)
                    newline = buffer.indexOf('\n')
                  }
                }
              } finally {
                await reader.cancel().catch(() => {})
                reader.releaseLock()
              }
            } catch {
              // try next port
            }
          }
          document.title = ''
          await new Promise((resolve) => setTimeout(resolve, 500))
        }
      })()
    </script>
  </body>
</html>
